name: Build Mac Catalyst

on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      upload_testflight:
        required: true
        type: boolean
      build_dmg:
        required: true
        type: boolean
      direct_distribution:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional build number override
        type: string
        required: false
      upload_testflight:
        description: Upload the Catalyst build to TestFlight
        type: boolean
        default: false
      build_dmg:
        description: Upload a DMG artifact
        type: boolean
        default: true
      direct_distribution:
        description: Build and notarize a Developer ID installer package
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: catalyst-build-${{ inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Distribute
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Determine build actions
        id: build_actions
        run: |
          # Direct distribution is temporarily disabled until its signing
          # assets are ready. Restore these input-backed outputs to re-enable it.
          # echo "build_dmg=${{ inputs.build_dmg }}" >> $GITHUB_OUTPUT
          # echo "direct_distribution=${{ inputs.direct_distribution }}" >> $GITHUB_OUTPUT
          echo "build_dmg=false" >> $GITHUB_OUTPUT
          echo "direct_distribution=false" >> $GITHUB_OUTPUT
          echo "upload_testflight=${{ inputs.upload_testflight }}" >> $GITHUB_OUTPUT

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4.11
          bundler-cache: true

      - name: Install Node modules
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-catalyst-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-catalyst-

      - name: Install CocoaPods dependencies
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          RCT_USE_RN_DEP: "1"
          RCT_USE_PREBUILT_RNCORE: "1"
        run: bundle exec fastlane ios install_pods

      - name: Create temporary keychain for signing
        if: steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true'
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Create App Store Connect API Key JSON
        if: steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true'
        run: echo '${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}' > ./appstore_api_key.json

      - name: Allocate Manual TestFlight Build Number
        id: manual_allocate
        if: github.event_name == 'workflow_dispatch' && steps.build_actions.outputs.upload_testflight == 'true' && inputs.build_number == ''
        run: bundle exec fastlane ios allocate_apple_build_number
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          APP_STORE_CONNECT_API_KEY_PATH: ./appstore_api_key.json

      - name: Generate and Set Shared Apple Build Number
        id: apple_build_number
        run: bundle exec fastlane ios increment_build_number_lane
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          NEW_BUILD_NUMBER: ${{ inputs.build_number || steps.manual_allocate.outputs.build_number }}

      - name: Build Mac Catalyst app with Fastlane
        id: build_catalyst
        run: bundle exec fastlane ios build_catalyst_app_lane
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          SKIP_CLEAR_DERIVED_DATA: '1'
          CATALYST_SIGNING_IDENTITY: ${{ (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true') && (secrets.CATALYST_SIGNING_IDENTITY || 'Apple Distribution') || '' }}
          CATALYST_TEAM_ID: ${{ (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true') && (secrets.CATALYST_TEAM_ID || secrets.TEAM_ID || secrets.ITC_TEAM_ID) || '' }}
          GIT_URL: ${{ (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true') && secrets.GIT_URL || '' }}
          GIT_ACCESS_TOKEN: ${{ (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true') && secrets.GIT_ACCESS_TOKEN || '' }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: 'true'
          KEYCHAIN_NAME: ${{ (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true') && 'build' || '' }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Export, Sign, and Notarize Direct Distribution Artifacts
        id: direct_distribution
        if: always() && !cancelled() && steps.build_catalyst.outcome == 'success' && steps.build_actions.outputs.direct_distribution == 'true'
        run: bundle exec fastlane ios export_catalyst_direct_distribution
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          CATALYST_TEAM_ID: ${{ secrets.CATALYST_TEAM_ID || secrets.TEAM_ID || secrets.ITC_TEAM_ID }}
          CATALYST_ARCHIVE_PATH: ${{ steps.build_catalyst.outputs.catalyst_archive_path }}
          GIT_URL: ${{ secrets.GIT_URL }}
          GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: 'true'
          KEYCHAIN_NAME: build
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Upload Mac Catalyst DMG
        id: upload_dmg
        if: >-
          always() && !cancelled() && steps.build_actions.outputs.build_dmg == 'true' &&
          ((steps.build_actions.outputs.direct_distribution == 'true' && steps.direct_distribution.outputs.direct_distribution_ready == 'true') ||
          (steps.build_actions.outputs.direct_distribution != 'true' && steps.build_catalyst.outcome == 'success'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlueWallet-Mac-Catalyst-Notarized-DMG
          path: ${{ steps.direct_distribution.outputs.direct_dmg_path || steps.build_catalyst.outputs.catalyst_dmg_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Notarized Direct Distribution PKG
        id: upload_direct_pkg
        if: always() && steps.direct_distribution.outputs.direct_distribution_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlueWallet-Mac-Catalyst-Notarized-PKG
          path: ${{ steps.direct_distribution.outputs.direct_pkg_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Post Direct Distribution PKG Comment
        if: always() && github.event.pull_request.number != null && steps.upload_direct_pkg.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_NUMBER: ${{ steps.apple_build_number.outputs.build_number }}
          ARTIFACT_ID: ${{ steps.upload_direct_pkg.outputs.artifact-id }}
        with:
          script: |
            const buildNumber = process.env.BUILD_NUMBER;
            const marker = '<!-- catalyst-direct-pkg -->';
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${process.env.ARTIFACT_ID}`;
            const message = `${marker}\n✅ Notarized Mac Catalyst installer ${buildNumber} is ready for direct distribution.\n\n[Download PKG](${artifactUrl})`;
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo,
              issue_number: prNumber,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body: message,
              });
            }

      - name: Upload to TestFlight
        id: upload_testflight
        if: always() && !cancelled() && steps.build_catalyst.outcome == 'success' && steps.build_actions.outputs.upload_testflight == 'true'
        run: bundle exec fastlane ios upload_catalyst_to_testflight
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          CATALYST_TEAM_ID: ${{ secrets.CATALYST_TEAM_ID || secrets.TEAM_ID || secrets.ITC_TEAM_ID }}
          CATALYST_ARCHIVE_PATH: ${{ steps.build_catalyst.outputs.catalyst_archive_path }}
          TEAM_ID: ${{ secrets.TEAM_ID || secrets.ITC_TEAM_ID }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          LATEST_COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Manual build' }}

      - name: Post Mac Catalyst TestFlight Ready Comment
        if: always() && github.event.pull_request.number != null && steps.upload_testflight.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_NUMBER: ${{ steps.apple_build_number.outputs.build_number }}
        with:
          script: |
            const buildNumber = process.env.BUILD_NUMBER;
            const marker = '<!-- catalyst-testflight-ready -->';
            const message = `${marker}\n✅ Mac Catalyst TestFlight build ${buildNumber} has finished processing and is ready for testing.`;
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo,
              issue_number: prNumber,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body: message,
              });
            }

      - name: Cleanup App Store Connect API Key JSON
        if: always() && (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true')
        run: rm -f ./appstore_api_key.json

      - name: Cleanup temporary keychain
        if: always() && (steps.build_actions.outputs.upload_testflight == 'true' || steps.build_actions.outputs.direct_distribution == 'true')
        run: security delete-keychain build.keychain || true

      - name: Comment on PR with DMG link
        if: always() && github.event.pull_request.number != null && steps.upload_dmg.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_dmg.outputs.artifact-id }}"
          COMMENT_TAG="<!-- catalyst-dmg-link -->"

          COMMENT_FILE="$(mktemp)"
          {
            printf '%s\n' "${COMMENT_TAG}"
            printf '### Mac Catalyst Direct Distribution\n\n'
            printf 'The notarized Developer ID DMG is ready for download:\n\n'
            printf '[Download notarized Mac Catalyst DMG](%s)\n' "${ARTIFACT_URL}"
            printf '<sub>Built from `%s`</sub>\n' "${{ inputs.source_sha || github.sha }}"
          } >"${COMMENT_FILE}"

          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq '.[] | select(.body | contains("<!-- catalyst-dmg-link -->")) | .id' | \
            while read -r comment_id; do
              gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${comment_id}" || true
            done

          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${COMMENT_FILE}"
