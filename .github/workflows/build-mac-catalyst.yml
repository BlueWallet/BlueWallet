name: Mac Catalyst TestFlight

on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      allocation_attempt:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional build number override
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: catalyst-testflight-${{ inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Upload
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate release attempt
        env:
          ALLOCATION_ATTEMPT: ${{ inputs.allocation_attempt }}
        run: |
          if [ -n "$ALLOCATION_ATTEMPT" ] && [ "$ALLOCATION_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Choose Re-run all jobs to allocate a new shared build number; re-running only failed jobs can reuse an accepted TestFlight build.'
            exit 1
          fi

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.11
          bundler-cache: true

      - name: Install Node modules
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-v2-catalyst-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-v2-catalyst-

      - name: Install CocoaPods dependencies
        run: bundle exec fastlane ios install_pods
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          RCT_USE_RN_DEP: '1'
          RCT_USE_PREBUILT_RNCORE: '1'

      - name: Create temporary signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Create App Store Connect API key
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: printf '%s' "$API_KEY_CONTENT" > appstore_api_key.json

      - name: Set shared Apple build number
        id: build_number
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BUILD_NUMBER="${REQUESTED_BUILD_NUMBER:-$(ruby -e 'puts 5_000_000_000_000 + (Time.now.to_r * 1000).to_i')}"
          export NEW_BUILD_NUMBER="$BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          bundle exec fastlane ios increment_build_number_lane

      - name: Build Mac Catalyst archive
        id: build_catalyst
        timeout-minutes: 180
        run: bundle exec fastlane ios build_catalyst_app_lane
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          SKIP_CLEAR_DERIVED_DATA: '1'
          CATALYST_SIGNING_IDENTITY: ${{ secrets.CATALYST_SIGNING_IDENTITY || 'Apple Distribution' }}
          CATALYST_TEAM_ID: ${{ secrets.CATALYST_TEAM_ID || secrets.TEAM_ID || secrets.ITC_TEAM_ID }}
          GIT_URL: ${{ secrets.GIT_URL }}
          GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: 'true'
          KEYCHAIN_NAME: build
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Export and upload to TestFlight
        id: upload_testflight
        timeout-minutes: 110
        run: bundle exec fastlane ios upload_catalyst_to_testflight
        env:
          SKIP_APP_STORE_CONNECT_AUTH: '1'
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/appstore_api_key.json
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          CATALYST_TEAM_ID: ${{ secrets.CATALYST_TEAM_ID || secrets.TEAM_ID || secrets.ITC_TEAM_ID }}
          CATALYST_ARCHIVE_PATH: ${{ steps.build_catalyst.outputs.catalyst_archive_path }}
          TEAM_ID: ${{ secrets.TEAM_ID || secrets.ITC_TEAM_ID }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          LATEST_COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Manual build' }}

      - name: Post TestFlight ready comment
        if: github.event.pull_request.number != null
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        with:
          script: |
            const marker = '<!-- catalyst-testflight-ready -->';
            const message = `${marker}\n✅ Mac Catalyst TestFlight build ${process.env.BUILD_NUMBER} has finished processing and is ready for testing.`;
            const repo = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...repo, comment_id: existing.id, body: message });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number, body: message });
            }

      - name: Show Catalyst archive failure details
        if: failure() && steps.build_catalyst.outcome == 'failure'
        run: |
          tail -n 300 ios/build_logs/BlueWallet-BlueWallet.log || true

      - name: Upload Catalyst build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalyst-build-logs
          path: ios/build_logs/
          retention-days: 7

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f appstore_api_key.json
          security delete-keychain build.keychain || true
