name: BuildReleaseApk

on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
      source_sha:
        required: true
        type: string

jobs:
  buildReleaseApk:
    runs-on: ubuntu-24.04
    outputs:
      apk_filename: ${{ steps.build_and_sign_apk.outputs.apk_filename }}
      apk_artifact_url: ${{ steps.upload_apk.outputs.artifact-url }}

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"
          ref: ${{ inputs.source_sha }}

      - name: Free disk space (Android build)
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          df -h

      - name: Specify node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Set npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.2.2

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use gradle caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Override the default package list, which includes the unavailable legacy tools package.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Node Modules
        run: npm ci --omit=dev --yes

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.11
          bundler-cache: true

      - name: Build and sign APK
        id: build_and_sign_apk
        run: bundle exec fastlane android build_release_apk
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-logs
          path: |
            android/**/*.log
            android/**/build/**/*.log
            android/**/outputs/logs/**/*.log
            android/**/reports/**/*.log
          if-no-files-found: warn

      - name: Upload APK as artifact
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: ${{ steps.build_and_sign_apk.outputs.apk_output_path }}
          if-no-files-found: error

  browserstack:
    runs-on: macos-26
    needs: buildReleaseApk
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'browserstack') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.11
          bundler-cache: true

      - name: Install dependencies with Bundler
        run: bundle install --jobs 4 --retry 3

      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: browserstack-apk

      - name: Upload APK to BrowserStack
        id: browserstack_upload
        env:
          APK_PATH: ${{ github.workspace }}/browserstack-apk/${{ needs.buildReleaseApk.outputs.apk_filename }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bundle exec fastlane android upload_to_browserstack

      - name: Post BrowserStack PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_URL: ${{ steps.browserstack_upload.outputs.browserstack_app_url }}
          APK_FILENAME: ${{ needs.buildReleaseApk.outputs.apk_filename }}
          APK_ARTIFACT_URL: ${{ needs.buildReleaseApk.outputs.apk_artifact_url }}
        with:
          script: |
            const heading = '### APK Successfully Uploaded to BrowserStack';
            const appId = process.env.APP_URL.slice('bs://'.length);
            const devices = [
              ["Google Pixel 9 (Android 15)","15.0","Google Pixel 9"],
              ["Google Pixel 8 (Android 14)","14.0","Google Pixel 8"],
              ["Google Pixel 7 (Android 13)","13.0","Google Pixel 7"],
              ["Google Pixel 5 (Android 12)","12.0","Google Pixel 5"],
              ["Google Pixel 3a (Android 9)","9.0","Google Pixel 3a"],
              ["Samsung Galaxy Z Fold 6 (Android 14)","14.0","Samsung Galaxy Z Fold 6"],
              ["Samsung Galaxy Z Fold 5 (Android 13)","13.0","Samsung Galaxy Z Fold 5"],
              ["Samsung Galaxy Tab S9 (Android 13)","13.0","Samsung Galaxy Tab S9"],
              ["Samsung Galaxy Note 9 (Android 8.1)","8.1","Samsung Galaxy Note 9"],
              ["OnePlus 11R (Android 13)","13.0","OnePlus 11R"],
            ];
            const links = devices.map(([label, version, device]) => {
              const params = new URLSearchParams({
                os: 'android', os_version: version, device, app_hashed_id: appId,
                scale_to_fit: 'true', speed: '1', start: 'true', browser: 'chrome',
              });
              return `- [${label}](https://app-live.browserstack.com/dashboard#${params})`;
            });
            const body = [
              heading, '', 'You can test it on the following devices:', '', ...links, '',
              `**Filename**: [${process.env.APK_FILENAME}](${process.env.APK_ARTIFACT_URL})`,
              `**BrowserStack App URL**: ${process.env.APP_URL}`,
            ].join('\n');
            const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.startsWith(heading)
              && comment.user?.login === 'github-actions[bot]'
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
