name: BuildReleaseApk

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - master

jobs:
  buildReleaseApk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"

      - name: Free disk space (Android build)
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@aa33708b10e362ff993539393ff100fa93ed6a27 # v3.5.0

      - name: Build reproducible build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: reproducible-builds/Dockerfile
          platforms: linux/amd64
          tags: android-build-env:latest
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare output directory
        run: |
          OUT="${{ github.workspace }}/reproducible-builds/build"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          chmod 775 "$OUT"
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

      - name: Run reproducible build inside container
        id: run_build
        env:
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          set +e
          docker run --platform linux/amd64 \
            -e KEYSTORE_FILE_HEX \
            -e KEYSTORE_PASSWORD \
            -v "$OUT_DIR":/build \
            android-build-env:latest \
            bash /app/inside-docker.sh 2>&1 | tee "$OUT_DIR/docker-build.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-logs
          path: |
            reproducible-builds/build/docker-build.log
          if-no-files-found: warn

      - name: Determine APK filename and rename output
        id: determine_apk_path
        run: |
          VERSION_NAME=$(grep versionName android/app/build.gradle | awk '{print $2}' | tr -d '"')
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ -n "$BRANCH_NAME" ] && [ "$BRANCH_NAME" != "master" ]; then
            EXPECTED_FILENAME="BlueWallet-${VERSION_NAME}-${SHORT_SHA}-${BRANCH_NAME}.apk"
          else
            EXPECTED_FILENAME="BlueWallet-${VERSION_NAME}-${SHORT_SHA}.apk"
          fi

          SRC="$OUT_DIR/Bluewallet-latest.apk"
          DEST="$OUT_DIR/${EXPECTED_FILENAME}"

          if [ ! -f "$SRC" ]; then
            echo "Expected build output not found at $SRC" >&2
            exit 1
          fi

          mv "$SRC" "$DEST"

          echo "EXPECTED_FILENAME=${EXPECTED_FILENAME}" >> $GITHUB_ENV
          echo "APK_PATH=${DEST}" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  browserstack:
    runs-on: macos-26
    needs: buildReleaseApk
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'browserstack') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: 3.4.10
          bundler-cache: true

      - name: Install dependencies with Bundler
        run: bundle install --jobs 4 --retry 3

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-apk

      - name: Set APK Path
        run: |
          APK_PATH=$(find ${{ github.workspace }} -name '*.apk')
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK to BrowserStack and Post PR Comment
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane upload_to_browserstack_and_comment