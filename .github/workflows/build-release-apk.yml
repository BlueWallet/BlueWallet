name: BuildReleaseApk

on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      GIT_URL:
        required: true
      GIT_ACCESS_TOKEN:
        required: true
      MATCH_PASSWORD:
        required: true
      KEYSTORE_PASSWORD:
        required: true

jobs:
  buildReleaseApk:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_url: ${{ steps.upload_apk.outputs.artifact-url }}
      apk_filename: ${{ steps.build_and_sign_apk.outputs.apk_filename }}

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Free disk space (Android build)
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          df -h

      - name: Specify node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Set npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.2.2

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use gradle caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Override the default package list, which includes the unavailable legacy tools package.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Node Modules
        run: npm ci --omit=dev --yes

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.11
          bundler-cache: true

      - name: Validate shared build number
        id: build_number
        env:
          SHARED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if ! [[ "$SHARED_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Shared build number must contain digits only" >&2
            exit 1
          fi
          if [ "$SHARED_BUILD_NUMBER" -eq 0 ]; then
            echo "Shared build number must be positive" >&2
            exit 1
          fi
          if [ "$SHARED_BUILD_NUMBER" -gt 2100000000 ]; then
            echo "Shared build number $SHARED_BUILD_NUMBER exceeds the Play Store limit" >&2
            exit 1
          fi
          echo "NEW_BUILD_NUMBER=$SHARED_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$SHARED_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build and sign APK
        id: build_and_sign_apk
        run: bundle exec fastlane android build_release_apk
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
          GIT_URL: ${{ secrets.GIT_URL }}
          GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
          ANDROID_SIGNING_DECRYPTION_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Confirm APK signer matches private Match certificate
        env:
          APK_PATH: ${{ steps.build_and_sign_apk.outputs.apk_output_path }}
          EXPECTED_SHA256: ${{ steps.build_and_sign_apk.outputs.signing_certificate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo '::error::Missing or invalid verified Match certificate fingerprint.'
            exit 1
          fi
          VERIFICATION=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_SHA256=$(printf '%s\n' "$VERIFICATION" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo '::error::APK signer does not match the verified private Match certificate.'
            exit 1
          fi
          echo 'Confirmed: APK signature is valid and matches the private Match signing certificate.'
          {
            echo '### Android APK signature verified'
            echo 'The finished APK has a valid signature matching the private Match certificate and the pinned signing fingerprint.'
            printf '\nCertificate SHA-256: `%s`\n' "$ACTUAL_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as artifact
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: ${{ steps.build_and_sign_apk.outputs.apk_output_path }}
          if-no-files-found: error

  comment_apk:
    name: Comment signed APK artifact on labeled PR
    needs: buildReleaseApk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post APK download link for comment-apk PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_URL: ${{ needs.buildReleaseApk.outputs.artifact_url }}
          APK_FILENAME: ${{ needs.buildReleaseApk.outputs.apk_filename }}
        with:
          script: |
            const { SOURCE_SHA, ARTIFACT_URL, APK_FILENAME } = process.env;
            if (!ARTIFACT_URL || !APK_FILENAME) {
              core.setFailed('Signed APK artifact URL or filename is missing.');
              return;
            }
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: SOURCE_SHA, per_page: 100,
            });
            for (const pr of prs) {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: pr.number,
              });
              if (!current.labels.some(label => label.name === 'comment-apk')) continue;
              const filename = APK_FILENAME.replace(/[\\\[\]]/g, '\\$&');
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number,
                body: `Signed APK artifact: [${filename}](${ARTIFACT_URL})\n\nBuilt from commit ${SOURCE_SHA}.`,
              });
            }
