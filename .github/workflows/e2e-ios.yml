name: Tests e2e iOS

on: [pull_request]

permissions:
  contents: read

# Experiment PR: every commit gets its own run (no cancellation of earlier commits).
concurrency:
  group: e2e-ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # head = this PR (RN 0.88), master = current master (RN 0.85). Same toolchain for both.
        source: [head, master]
    env:
      BUILD_CONFIGURATION: Release
      CCACHE_MAXSIZE: "2G"
      CCACHE_DIR: /Users/runner/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.source == 'master' && 'master' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.11"
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci || npm ci

      - name: Cache CocoaPods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-v2-prebuilt-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-v2-prebuilt-

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.source }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.source }}-
            ${{ runner.os }}-ccache-

      - name: Delete extension targets
        run: |
          bundle exec ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/BlueWallet.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target_names = %w[WidgetsExtension Stickers QuickLookPreview QuickLookThumbnail]
          embed_phase_names = ['Embed Watch Content', 'Embed Foundation Extensions']
          removed_any = false

          target_names.each do |target_name|
            target = project.targets.find { |t| t.name == target_name }
            next unless target

            puts "Removing target #{target_name}"
            target.dependencies.each(&:remove_from_project)
            target.build_phases.each(&:remove_from_project)
            project.targets.delete(target)
            removed_any = true
          end

          main_target = project.targets.find { |t| t.name == 'BlueWallet' }
          if main_target
            main_target.build_phases.select { |phase| embed_phase_names.include?(phase.display_name) }.each do |phase|
              puts "Removing build phase #{phase.display_name}"
              phase.remove_from_project
              main_target.build_phases.delete(phase)
              removed_any = true
            end
          end

          if removed_any
            project.save
            puts 'Extension and watch target references removed'
          else
            puts 'No extension or watch targets found'
          end
          RUBY

      - name: Remove extension schemes
        run: |
          rm -f ios/BlueWallet.xcodeproj/xcshareddata/xcschemes/WidgetsExtension.xcscheme
          rm -f ios/BlueWallet.xcodeproj/xcshareddata/xcschemes/Stickers.xcscheme

      - name: Install CocoaPods dependencies
        env:
          RCT_USE_RN_DEP: "1"
          RCT_USE_PREBUILT_RNCORE: "1"
          USE_CCACHE: "1"
        run: bundle exec fastlane ios install_pods || bundle exec fastlane ios install_pods

      - name: Reset ccache stats
        run: ccache -z || true

      - name: Build iOS simulator app
        working-directory: ios
        env:
          RCT_NO_LAUNCH_PACKAGER: "1"
          CCACHE_BINARY: /opt/homebrew/bin/ccache
        run: |
          set -eo pipefail
          xcodebuild -version
          build() {
            xcodebuild \
              -workspace BlueWallet.xcworkspace \
              -scheme BlueWallet \
              -configuration "${BUILD_CONFIGURATION}" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CLANG_ENABLE_EXPLICIT_MODULES=NO \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO \
              build
          }
          build || build

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Package simulator app
        run: |
          APP_DIR="ios/build/Build/Products/${BUILD_CONFIGURATION}-iphonesimulator/BlueWallet.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Simulator app not found at $APP_DIR"
            find ios/build -maxdepth 5 -name '*.app' || true
            exit 1
          fi
          plutil -p "$APP_DIR/Info.plist" | grep -E 'DTSDKName|DTXcode"|UIDesignRequiresCompatibility|MinimumOSVersion' || true
          tar -czf BlueWallet.app.tar.gz -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"

      - name: Upload simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluewallet-ios-app-${{ matrix.source }}
          path: BlueWallet.app.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  test:
    runs-on: macos-26
    needs: build
    strategy:
      fail-fast: false
      matrix:
        source: [head, master]
    env:
      HD_MNEMONIC: ${{ secrets.HD_MNEMONIC }}
      HD_MNEMONIC_BIP84: ${{ secrets.HD_MNEMONIC_BIP84 }}
      MNEMONICS_COBO: ${{ secrets.MNEMONICS_COBO }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.source == 'master' && 'master' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm ci

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils

      - name: Download simulator app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bluewallet-ios-app-${{ matrix.source }}

      - name: Restore simulator app
        run: |
          mkdir -p ios/build/Build/Products/Release-iphonesimulator
          tar -xzf BlueWallet.app.tar.gz -C ios/build/Build/Products/Release-iphonesimulator

      # Pre-boot simulator so first detox launchApp lands warm.
      - name: Pre-boot iOS simulator
        run: |
          DEVICE_TYPE=$(jq -r '.devices.simulator.device.type' .detoxrc.json)
          UDID=$(applesimutils --list --byType "$DEVICE_TYPE" | jq -r '.[0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "ERROR: no simulator of type '$DEVICE_TYPE' found"
            exit 1
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl launch "$UDID" com.apple.springboard >/dev/null 2>&1 || true

      # Cut animations so detox sync stays steady on slow CI VMs; Reduce Motion makes reanimated skip to final value.
      - name: Disable simulator animations
        run: |
          defaults write com.apple.iphonesimulator SlowMotionAnimation -bool NO
          xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl spawn booted notifyutil -p com.apple.Accessibility.ReduceMotionStatusDidChange

      # Experiment: open the Import Wallet header menu, check item visibility at 100%, then force a
      # failing match so Detox (verbose) dumps the full window hierarchy. Same spec on both sources.
      - name: Write hierarchy dump spec
        run: |
          cat > tests/e2e/zz-dump.spec.js <<'EOF'
          import { element, waitFor } from 'detox';
          import { tapAndTapAgainIfElementIsNotVisible, tapIfTextPresent, waitForId } from './helperz';

          describe('zz dump', () => {
            it('dumps window hierarchy with header menu open', async () => {
              await device.clearKeychain();
              await device.launchApp({ delete: true });
              await waitForId('WalletsList');
              await waitFor(element(by.id('CreateAWallet')))
                .toBeVisible()
                .whileElement(by.id('WalletsList'))
                .scroll(500, 'right');
              await tapAndTapAgainIfElementIsNotVisible('CreateAWallet', 'ScrollView');
              await waitFor(element(by.id('ImportWallet')))
                .toBeVisible()
                .whileElement(by.id('ScrollView'))
                .scroll(500, 'down');
              await element(by.id('ImportWallet')).tap();
              await element(by.id('MnemonicInput')).typeText('zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo wrong');
              await tapIfTextPresent('Done');
              await element(by.id('HeaderMenuButton')).tap();
              // Timing probe: is the menu label obscured only right after the tap (animation in flight)?
              for (const pause of [0, 500, 1500, 3000]) {
                if (pause) await new Promise(r => setTimeout(r, pause));
                try {
                  await expect(element(by.text('Search accounts'))).toBeVisible(100);
                  console.warn(`PROBE pause=${pause}ms visible(100)=PASS`);
                } catch (e) {
                  console.warn(`PROBE pause=${pause}ms visible(100)=FAIL ${String(e.message).split('\n')[0]}`);
                }
              }
              await expect(element(by.text('__force_hierarchy_dump__'))).toExist();
            });
          });
          EOF

      - name: Run detox dump spec
        timeout-minutes: 60
        run: |
          npm run e2e:test:ios-release -- tests/e2e/zz-dump.spec.js \
            --record-videos failing \
            --record-logs failing \
            --take-screenshots failing \
            --headless \
            --retries 0 \
            --reuse \
            --loglevel verbose \
            --artifacts-location ./artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-ios-dump-${{ matrix.source }}
          path: ./artifacts/
