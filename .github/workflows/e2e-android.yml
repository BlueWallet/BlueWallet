name: Tests e2e Android

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Free disk space (Ubuntu)
      run: |
        echo "Disk before cleanup:" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/local/lib/android/sdk/ndk || true
        sudo docker system prune -af || true
        sudo rm -rf /usr/local/lib/android/sdk/system-images || true
        sudo rm -rf /usr/local/lib/android/sdk/emulator || true
        rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
        rm -rf ~/.gradle/caches/build-cache || true
        rm -rf ~/.npm/_cacache ~/.cache || true
        sudo rm -rf /home/runner/work/_temp || true
        echo "Disk after cleanup:" && df -h

    - name: Specify node version
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Use gradle caches
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install node_modules
      run: npm ci || npm ci

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build
      run: npm run e2e:release-build || npm run e2e:release-build

    - name: Package APKs
      run: |
        tar -czf bluewallet-android-apks.tar.gz \
          android/app/build/outputs/apk/release/app-release.apk \
          android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

    - name: Upload APKs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bluewallet-android-apks
        path: bluewallet-android-apks.tar.gz
        retention-days: 3
        compression-level: 0
        if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    needs: build
    env:
      HD_MNEMONIC: ${{ secrets.HD_MNEMONIC }}
      HD_MNEMONIC_BIP84: ${{ secrets.HD_MNEMONIC_BIP84 }}
      MNEMONICS_COBO: ${{ secrets.MNEMONICS_COBO }}

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Free disk space (Ubuntu)
      run: |
        echo "Disk before cleanup:" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/local/lib/android/sdk/ndk || true
        sudo docker system prune -af || true
        rm -rf ~/.npm/_cacache ~/.cache || true
        sudo rm -rf /home/runner/work/_temp || true
        echo "Disk after cleanup:" && df -h

    - name: Ensure artifacts directory
      run: mkdir -p ${{ github.workspace }}/artifacts

    - name: Specify node version
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install node_modules
      run: npm ci || npm ci

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Download APKs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bluewallet-android-apks

    - name: Restore APKs
      run: tar -xzf bluewallet-android-apks.tar.gz

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 36
        profile: pixel
        avd-name: Pixel_API_29_AOSP
        force-avd-creation: true
        enable-hw-keyboard: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2047
        arch: x86_64
        script: |
          # Quickstep can ANR during emulator boot and leave a focus-stealing
          # system dialog over every test. Stop it before launching BlueWallet.
          adb shell settings put global hide_error_dialogs 1
          adb shell am force-stop com.android.launcher3
          # An app can still ANR right after this, and the setting above does not close a dialog
          # already shown. CLOSE_SYSTEM_DIALOGS does.
          for i in 1 2 3 4 5 6; do adb shell dumpsys window | grep -q "Application Not Responding" && echo "::warning::ANR dialog at boot, closing it" && adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null; sleep 5; done; true
          npm run e2e:release-test -- --record-videos failing --record-logs failing --take-screenshots failing --headless --retries 4 --reuse --artifacts-location ${{ github.workspace }}/artifacts

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: e2e-android-videos
        path: ${{ github.workspace }}/artifacts
