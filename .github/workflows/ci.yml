name: Tests

# https://dev.to/edvinasbartkus/running-react-native-detox-tests-for-ios-and-android-on-github-actions-2ekn
# https://medium.com/@reime005/the-best-ci-cd-for-react-native-with-e2e-support-4860b4aaab29

# No secrets: the unit and integration suites use test-only fixtures and a
# local server. The Bitcoin-era mnemonic secrets were read by no test here.

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Specify node version
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install node_modules
      run: npm ci || npm ci

    # One step per check, and every step runs even if an earlier one failed,
    # so a failing stage does not hide the results of the next ones.
    - name: TypeScript (app and privacy host)
      run: npm run tslint

    - name: Unused localization keys
      if: success() || failure()
      run: npm run lint:loc

    - name: libsodium copy matches its signed release
      if: success() || failure()
      run: npm run lint:libsodium

    - name: ESLint
      if: success() || failure()
      run: npm run lint:eslint

  unit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Specify node version
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install node_modules
      run: npm ci || npm ci

    # Every tests/unit/*.test.* file must be discovered: a script glob once
    # swallowed the first file as the --maxWorkers value.
    - name: Check the unit test inventory
      run: |
        expected=$(ls tests/unit/*.test.* | wc -l)
        found=$(npx jest --listTests tests/unit | wc -l)
        echo "unit test files: $expected, discovered by jest: $found"
        test "$expected" -eq "$found"

    - name: Run tests
      run: npm run unit

  integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Specify node version
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install node_modules
      run: npm ci || npm ci

    # Deterministic (local server), so no retries are needed.
    - name: Run tests
      run: npm run integration
